# /etc/aipicam/streams.conf
#
# Single source of truth for picam-raw's raw camera stream geometry and
# ports. picam-raw's wire protocol carries no width/height field (see its
# README), so every reader — picam-orchestrator, picam-hailo, and
# picam-recorder — must already agree with what picam-raw actually
# captures and sends, or it misinterprets the byte stream (wrong plane
# offsets, corrupted video) with no error raised anywhere.
#
# Before this file existed, each of those four packages shipped its own
# hand-copied width/height/port defaults, and they silently drifted apart
# (picam-orchestrator shipped 1920x1080 for main while picam-raw actually
# sends 2304x1296 — the resulting frame corruption was hard to trace back
# to a config mismatch precisely because nothing ever errors on it).
#
# Edit this file, not the corresponding fields in any other package's own
# config, and restart every camera-pipeline service afterwards:
#
#   sudo systemctl restart picam-raw picam-orchestrator picam-hailo picam-recorder

[stream]
main_width      = 2304
main_height     = 1296
lores_width     = 640
lores_height    = 360

main_port       = 8560
lores_port      = 8561
telemetry_port  = 8555
command_port    = 8556
